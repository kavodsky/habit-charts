name: Release

# Push a tag that is exactly the version in manifest.json (for example 0.3.1, without "v")
# and this workflow creates the GitHub release with main.js, manifest.json and styles.css.
# The three files are signed with GitHub artifact attestations.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        run: |
          VERSION=$(jq -r .version manifest.json)
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $VERSION in manifest.json" >&2
            exit 1
          fi

      - name: Attest the release files
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
